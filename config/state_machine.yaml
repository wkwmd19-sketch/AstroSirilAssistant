schema_version: "0.3.1"

states:
  PROJECT_CREATED:
    allowed_next: ["INPUT_IMPORTED"]

  INPUT_IMPORTED:
    allowed_next: ["INPUT_ANALYZED"]

  INPUT_ANALYZED:
    allowed_next:
      - "INPUT_STAGE_CONFIRMED"
      - "REVIEW_REQUIRED"

  INPUT_STAGE_CONFIRMED:
    allowed_next:
      - "CALIBRATION_CHECKED"
      - "PRECALIBRATED_CONFIRMED"
      - "STACKED_LINEAR"

  CALIBRATION_CHECKED:
    allowed_next:
      - "CALIBRATED"
      - "CALIBRATION_SKIPPED"
      - "REVIEW_REQUIRED"

  CALIBRATED:
    allowed_next: ["REGISTERED"]

  CALIBRATION_SKIPPED:
    allowed_next: ["REGISTERED"]

  PRECALIBRATED_CONFIRMED:
    allowed_next:
      - "REGISTERED"
      - "STACKED_LINEAR"
      - "GRADIENT_CORRECTED"

  REGISTERED:
    allowed_next: ["STACKED_LINEAR"]

  STACKED_LINEAR:
    allowed_next:
      - "GRADIENT_CORRECTED"
      - "COLOR_CALIBRATED"

  GRADIENT_CORRECTED:
    allowed_next: ["COLOR_CALIBRATED"]

  COLOR_CALIBRATED:
    allowed_next: ["DENOISED", "DEBLURRED", "STRETCHED"]

  DENOISED:
    allowed_next: ["DEBLURRED", "STRETCHED"]

  DEBLURRED:
    allowed_next: ["DENOISED", "STRETCHED"]

  STRETCHED:
    allowed_next: ["STARS_SEPARATED", "FINALIZED"]

  STARS_SEPARATED:
    allowed_next: ["STARLESS_PROCESSED", "STARS_PROCESSED"]

  STARLESS_PROCESSED:
    allowed_next: ["STARS_PROCESSED", "RECOMBINED"]

  STARS_PROCESSED:
    allowed_next: ["STARLESS_PROCESSED", "RECOMBINED"]

  RECOMBINED:
    allowed_next: ["FINALIZED"]

  FINALIZED:
    allowed_next: ["EXPORTED"]

  REVIEW_REQUIRED:
    allowed_next:
      - "INPUT_STAGE_CONFIRMED"
      - "CALIBRATION_CHECKED"
      - "STACKED_LINEAR"

  EXPORTED:
    allowed_next: []

guards:
  PREPROCESS_LIGHTS:
    deny_if:
      calibration.input_status: "PRECALIBRATED"
    reason: "이미 캘리브레이션된 데이터에 Dark/Flat/Bias를 중복 적용하지 않습니다."

  STACK_RAW_SEQUENCE:
    require_one_of:
      - "CALIBRATED"
      - "CALIBRATION_SKIPPED"

  GHS:
    require:
      image_state.linearity: "LINEAR"
      image_state.stretched: false
