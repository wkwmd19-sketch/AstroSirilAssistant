schema_version: "0.5.0"

gradient:
  samples: 20
  tolerance: 1.0
  smooth: 0.5
  dither: false

spcc:
  camera_mode: "OSC"
  sensor: "Sony IMX678"
  osc_filter: "DWARF Mini Astro"
  osc_lpf: ""
  white_reference: "Average Spiral Galaxy"
  catalog: "AUTO"
  bgtol_lower: -2.8
  bgtol_upper: 2.0


denoise:
  modulation: 1.0
  cosmetic_correction: true
  da3d: false
  independent_channels: false


deblur:
  psf_source: "STARS"
  symmetric_psf: false
  kernel_size: null
  iterations: 10
  regularization: "NONE"
  alpha: 3000
  multiplicative: false


ghs:
  method: "AUTO_GHS"
  auto:
    linked: true
    shadows_clip: -2.8
    stretch_amount: 1.0
    b: 13.0
    lp: 0.0
    hp: 0.7
    clip_mode: "rgbblend"
  manual:
    d: 1.0
    b: 0.0
    lp: 0.0
    sp: 0.0
    hp: 1.0
    luminance_mode: "HUMAN"
    clip_mode: "rgbblend"


starnet:
  engine: "PY_SCRIPT"
  stride_preset: "STANDARD"
  stride: 256
  upsample: false
  protect_highlights: true
  star_layer: "SUBTRACT"
  save_native_starmask: false


starless_processing:
  clahe_enabled: true
  clahe_clip_limit: 1.5
  clahe_tile_size: 12
  saturation_enabled: true
  saturation_amount: 0.10
  saturation_background_factor: 1.10
  saturation_hue_range: 6


stars_processing:
  brightness_scale: 0.70
  saturation_enabled: true
  saturation_amount: 0.08
  saturation_background_factor: 0.0
  saturation_hue_range: 6


recombine:
  star_weight: 1.0
  rescale_output: false
