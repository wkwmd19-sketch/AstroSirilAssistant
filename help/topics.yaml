schema_version: '0.1'
topics:
  gradient.samples:
    title: Samples
    tooltip: 수평 한 줄당 생성하는 배경 샘플 수입니다. 높일수록 배경 모델이 더 촘촘해집니다.
    detail: 'Siril RBF Background Extraction에서 수평 한 줄당 생성하는 배경 샘플 수입니다.


      기본 시작값: 20


      값을 높이면:

      - 배경을 더 촘촘하게 모델링할 수 있습니다.

      - 복잡한 Gradient에 유리할 수 있습니다.

      - M31처럼 큰 천체가 화면을 많이 차지하면 천체 신호가 배경 샘플에 섞이지 않는지 확인해야 합니다.


      값을 낮추면:

      - 더 넓고 완만한 배경 변화 위주로 모델링합니다.


      권장:

      - 20에서 시작해 미리보기로 확인합니다.

      '
  gradient.tolerance:
    title: Tolerance
    tooltip: 밝은 영역을 배경 샘플에서 제외하는 허용 기준입니다. 낮을수록 더 엄격합니다.
    detail: '배경 샘플에서 밝은 구조를 제외하는 기준입니다.

      Siril은 MAD를 기준으로 밝은 샘플을 판정합니다.


      기본 시작값: 1.0


      낮추면:

      - 밝은 별, 은하 외곽, 성운 구조를 배경에서 더 엄격히 제외하는 방향입니다.


      높이면:

      - 더 밝은 영역도 배경 샘플 후보로 허용합니다.


      주의:

      - 화면을 크게 차지하는 은하/성운에서는 지나치게 높은 값이 천체 구조를 배경으로 포함시킬 수 있습니다.

      '
  gradient.smooth:
    title: Smooth
    tooltip: RBF 배경 모델의 부드러움을 조절합니다. 높일수록 더 완만한 모델을 만드는 방향입니다.
    detail: 'RBF 배경 모델의 smoothing 정도를 조절합니다.


      기본 시작값: 0.5


      낮추면:

      - 배경의 세부 변화를 더 민감하게 따라갈 수 있습니다.


      높이면:

      - 더 부드럽고 완만한 배경 모델을 만드는 방향입니다.


      값이 높거나 낮다고 무조건 좋은 것은 아닙니다.

      미리보기에서 천체의 희미한 구조가 손실되지 않는지 확인하세요.

      '
  gradient.dither:
    title: Dither (Background Extraction)
    tooltip: Background Extraction 샘플링용 옵션입니다. 촬영 시 적도의 Dithering과는 다른 기능입니다.
    detail: 'Siril Background Extraction에서 사용하는 Dither 옵션입니다.


      낮은 동적 범위의 Gradient에서 도움이 될 수 있습니다.


      중요:

      - 촬영 중 적도의가 프레임 사이에서 움직이는 ''촬영 Dithering''과는 다른 기능입니다.

      - 기본적으로 OFF에서 시작하고 결과를 비교하는 방식이 좋습니다.

      '
  gradient.preview:
    title: 미리보기
    tooltip: 현재 설정으로 임시 결과를 생성합니다. 실제 작업 FITS나 프로젝트 State는 변경하지 않습니다.
    detail: '현재 파라미터를 원본 작업파일에 확정 적용하기 전에 결과를 확인합니다.


      프로그램은:

      1. 임시 Linear 결과 FITS를 저장하고

      2. 표시용으로만 AutoStretch를 적용한 JPEG를 생성합니다.


      JPEG의 AutoStretch는 보기 위한 표시용이며 실제 작업 FITS는 Linear 상태를 유지합니다.

      '
  gradient.apply:
    title: 승인 후 적용
    tooltip: 미리보기에서 확인한 동일한 설정을 실제 작업 FITS에 적용하고 다음 단계로 이동합니다.
    detail: '현재 파라미터로 생성한 미리보기를 확인한 뒤 실제 작업 이미지에 적용합니다.


      안전장치:

      - 파라미터를 바꾸면 이전 미리보기 승인은 무효가 됩니다.

      - 변경된 값으로 다시 미리보기해야 적용할 수 있습니다.

      - 결과는 새 FITS 파일로 저장됩니다.

      '
  spcc.what:
    title: SPCC
    tooltip: Gaia DR3 별 스펙트럼과 센서/필터 특성을 이용해 RGB 색 균형을 보정합니다.
    detail: 'SPCC는 Spectrophotometric Color Calibration의 약자입니다.


      Gaia DR3의 별 스펙트럼 정보와 촬영에 사용한 센서/필터 응답을 이용해

      이미지의 각 RGB 채널에 보정 계수를 계산합니다.


      중요:

      - 반드시 Linear 이미지에서 수행해야 합니다.

      - 이미지가 Plate Solved 상태여야 합니다.

      - 센서/필터 선택이 실제 촬영 장비와 최대한 가까워야 합니다.

      '
  spcc.platesolve:
    title: Plate Solve
    tooltip: 사진 속 별 위치를 실제 하늘 좌표와 대응시켜 WCS 천문 좌표 정보를 만드는 과정입니다.
    detail: 'Plate Solving은 이미지의 별 패턴을 천체 카탈로그와 비교하여

      사진의 중심 좌표, 방향, 픽셀 스케일 등 WCS 정보를 계산하는 작업입니다.


      SPCC는 카탈로그 별과 사진 속 별을 정확히 대응해야 하므로 Plate Solve가 필요합니다.


      v0.5.0:

      - SPCC 실행 전에 Siril의 platesolve 명령을 자동으로 호출합니다.

      - 이미 Plate Solved 이미지라면 Siril은 기존 해를 사용합니다.

      - WCS 및 촬영 메타데이터가 부족하면 Plate Solve가 실패할 수 있습니다.

      '
  spcc.camera_mode:
    title: OSC / Mono
    tooltip: 컬러 센서(OSC)인지 모노 센서인지 선택합니다. SPCC의 센서/필터 입력 방식이 달라집니다.
    detail: 'OSC:

      - Bayer 컬러 센서로 촬영해 최종 RGB가 된 이미지입니다.

      - OSC Sensor와 OSC Filter를 선택합니다.


      Mono:

      - 모노 센서 + R/G/B 필터를 사용한 이미지입니다.

      - Mono Sensor와 R/G/B 필터를 각각 선택합니다.


      DWARF 3 같은 컬러 센서는 OSC 경로를 사용합니다.

      '
  spcc.sensor:
    title: Sensor
    tooltip: 촬영에 사용한 이미지 센서를 선택합니다. 센서의 파장별 감도를 SPCC 계산에 사용합니다.
    detail: '카메라 센서의 Quantum Efficiency(파장별 감도) 데이터를 SPCC 계산에 사용합니다.


      가능한 실제 촬영 센서와 정확히 일치하는 항목을 선택하세요.

      정확한 항목이 없다면 Siril 문서의 안내처럼 가장 가까운 항목 또는 적절한 기본값을 사용할 수 있습니다.


      센서/필터 이름은 Siril SPCC 데이터베이스에 등록된 이름과 정확히 일치해야 합니다.

      '
  spcc.osc_filter:
    title: OSC Filter
    tooltip: OSC 카메라 앞에 사용한 필터를 선택합니다. 필터의 파장별 투과 특성을 SPCC에 반영합니다.
    detail: 'OSC 센서 앞에 사용한 필터의 스펙트럼 투과 특성을 지정합니다.


      예:

      - UV/IR Cut

      - Broadband / Light Pollution filter

      - 특정 스마트 망원경 필터


      실제 촬영에 사용하지 않은 필터를 선택하면 색 보정 결과가 왜곡될 수 있습니다.

      '
  spcc.osc_lpf:
    title: OSC LPF
    tooltip: 카메라 내부 Low-Pass/IR 필터가 별도 등록되어 있을 때 선택하는 옵션입니다. 보통 선택 사항입니다.
    detail: 'OSC 카메라 내부의 Low-Pass Filter / IR-cut 계열 응답을 별도로 지정할 때 사용합니다.


      해당 카메라/센서 조합에 필요한 항목인지 확실하지 않으면 비워두고 시작할 수 있습니다.

      '
  spcc.white_reference:
    title: White Reference
    tooltip: 어떤 스펙트럼을 '흰색 기준'으로 삼을지 선택합니다. 기본값은 Average Spiral Galaxy입니다.
    detail: 'SPCC가 최종 채널 균형을 결정할 때 사용하는 절대적인 흰색 기준 스펙트럼입니다.


      기본값:

      - Average Spiral Galaxy


      이 기준은 다양한 천체사진에서 널리 사용할 수 있는 기본값입니다.


      태양광을 흰색 기준으로 삼고 싶다면 G2(v) 별 기준을 사용할 수 있습니다.

      '
  spcc.catalog:
    title: Gaia DR3 Catalog
    tooltip: SPCC 별 데이터 소스를 선택합니다. AUTO는 로컬 카탈로그가 있으면 우선 사용하고 아니면 온라인을 사용합니다.
    detail: 'SPCC는 Gaia DR3 데이터를 사용합니다.


      AUTO:

      - Siril 기본 동작을 사용합니다.

      - 로컬 Gaia DR3 xp_sampled 카탈로그가 있으면 우선 사용할 수 있습니다.

      - 필요하면 온라인 Gaia를 사용합니다.


      Online Gaia:

      - 인터넷을 통해 Gaia DR3를 조회합니다.


      Local Gaia:

      - 설치된 로컬 Gaia SPCC 카탈로그만 사용합니다.

      '
  spcc.bgtol:
    title: Background Tolerance
    tooltip: SPCC의 배경 기준에서 이상치를 제외하는 sigma 범위입니다. 기본값은 -2.8 / +2.0입니다.
    detail: 'SPCC가 배경 기준을 측정할 때 이상치를 제외하는 범위를 sigma 단위로 지정합니다.


      Siril 기본값:

      - Lower: -2.8

      - Upper: +2.0


      AstroSirilAssistant v0.5.1:

      - 이 기본값을 사용하는 경우 `-bgtol` 인수를 별도로 전달하지 않고 Siril 자체 기본값을 사용합니다.

      - 이는 Siril 1.4.4 Windows CLI에서 기본값을 명시적으로 넘길 때 발생한 파서 오류를 피하기 위한 호환 처리입니다.


      특별한 이유가 없다면 기본값에서 시작하는 것을 권장합니다.

      '
  spcc.list_refresh:
    title: SPCC 목록 불러오기
    tooltip: 현재 설치된 Siril의 센서/필터/White Reference 목록을 직접 읽어옵니다.
    detail: 'Siril의 spcc_list 명령을 사용해 현재 설치된 SPCC 데이터베이스의 항목을 읽습니다.


      장점:

      - 이름 오타를 줄일 수 있습니다.

      - Siril 데이터베이스에 실제로 존재하는 항목만 선택할 수 있습니다.

      - 센서/필터 데이터베이스가 업데이트되어도 현재 설치 상태를 반영할 수 있습니다.

      '
  spcc.preview:
    title: SPCC 미리보기
    tooltip: Plate Solve + SPCC를 임시 복사본에 실행해 결과를 먼저 확인합니다.
    detail: '현재 Gradient 결과를 직접 바꾸지 않고 임시 복사본에:

      1. Plate Solve

      2. SPCC

      3. Linear preview FITS 저장

      4. 표시용 AutoStretch JPEG 생성

      순서로 처리합니다.


      결과가 만족스러우면 같은 설정으로 ''승인 후 적용''을 실행합니다.

      '
  spcc.apply:
    title: SPCC 승인 후 적용
    tooltip: 미리보기에서 확인한 동일한 설정으로 SPCC를 실제 작업 FITS에 적용합니다.
    detail: '미리보기와 동일한 Sensor / Filter / White Reference / Catalog / Background Tolerance 설정으로

      실제 SPCC 결과를 새 FITS로 저장합니다.


      적용 후:

      - project State = COLOR_CALIBRATED

      - 현재 파일이 새 SPCC FITS로 변경됩니다.

      - 다음 단계로 이동합니다.

      '
  denoise.what:
    title: Noise Reduction / Denoise
    tooltip: 수동 보정 흐름을 따라 Restoration 다음 Linear 단계에서 Prism 또는 Siril Native Denoise를 수행합니다.
    detail: 'v0.14.0 기본 엔진은 SyQon Prism Mini입니다.


      기본 순서:

      SPCC → Parallax → Prism → GHS


      Prism 결과도 Linear 상태를 유지해 GHS 이전 단계로 연결됩니다.'
  denoise.modulation:
    title: Modulation
    tooltip: Denoise 결과를 원본과 얼마나 섞을지 정합니다. 1.0은 전체 Denoise 효과입니다.
    detail: '`-mod=m` 값이며 범위는 0~1입니다.


      1.0:

      - Denoise 결과를 100% 적용합니다.

      - Siril 기본값입니다.


      0.5:

      - Denoise 결과와 원본을 절반 정도 섞는 효과입니다.


      0.0:

      - 사실상 원본과 동일합니다.


      권장:

      - 1.0에서 시작해 미리보기로 확인합니다.

      - 미세 구조가 지나치게 부드러워지면 값을 낮춰 비교하세요.

      '
  denoise.cosmetic:
    title: Cosmetic Correction
    tooltip: Denoise 전에 salt-and-pepper 계열의 잔여 핫/콜드 픽셀 보정을 수행합니다.
    detail: 'Siril `denoise`는 기본적으로 Denoise 전에 Cosmetic Correction을 수행합니다.


      Siril 문서에서도 salt-and-pepper 노이즈를 먼저 보정하는 것을 강하게 권장합니다.


      ON:

      - Siril 기본 동작을 사용합니다.


      OFF:

      - `-nocosmetic` 옵션을 사용합니다.

      - 앞 단계에서 이미 Cosmetic Correction을 확실히 완료한 경우에만 고려하세요.

      '
  denoise.da3d:
    title: DA3D
    tooltip: Denoise의 추가 정제 단계입니다. 디테일 보존과 계단형 아티팩트 감소에 도움을 줄 수 있지만 더 느립니다.
    detail: 'DA3D(Data-Adaptive Dual Domain Denoising)는 Denoise 후반의 추가 정제 단계입니다.


      기대 효과:

      - 세부 구조 개선

      - staircasing(계단형) 아티팩트 감소


      단점:

      - 처리 시간이 증가합니다.


      권장:

      - 기본 OFF

      - 기본 결과에서 미세한 계단형 질감이나 디테일 손실이 보일 때 ON으로 비교합니다.

      '
  denoise.independent:
    title: Independent RGB
    tooltip: RGB 채널을 독립적으로 Denoise합니다. 색 노이즈 특성이 다를 때 사용할 수 있습니다.
    detail: '`-indep` 옵션입니다.


      OFF:

      - 기본 처리 방식입니다.

      - 일반적인 OSC 컬러 이미지에서 우선 권장합니다.


      ON:

      - RGB 채널을 독립적으로 처리합니다.

      - 채널별 노이즈 특성이 크게 다를 때 비교할 수 있습니다.


      주의:

      - 색 균형이나 작은 색 구조가 달라질 수 있으므로 미리보기 확인이 중요합니다.

      '
  denoise.preview:
    title: Denoise 미리보기
    tooltip: 현재 Denoise 설정을 임시 복사본에 실행하고 AutoStretch JPEG로 확인합니다.
    detail: '현재 Linear 작업파일은 변경하지 않습니다.


      1. 임시 복사본에 Denoise

      2. Linear preview FITS 저장

      3. 표시용 AutoStretch JPEG 생성

      4. 기본 이미지 뷰어에서 JPEG 열기


      실제 작업 FITS는 미리보기 단계에서 변경되지 않습니다.

      '
  denoise.apply:
    title: Denoise 승인 후 적용
    tooltip: 미리보기에서 확인한 같은 설정으로 실제 작업 FITS에 Denoise를 적용합니다.
    detail: '미리보기와 동일한 설정을 실제 Linear 작업 이미지에 적용합니다.


      결과:

      - `working\05_denoise\..._05_denoise.fits`

      - State: DENOISED

      - Linear 상태 유지

      - 다음 단계: Deblur 또는 GHS 준비

      '
  denoise.skip:
    title: Denoise 건너뛰기
    tooltip: Denoise를 적용하지 않고 다음 처리 단계 준비로 이동합니다.
    detail: '이미지의 SNR이 충분하거나 외부 Denoise 도구를 사용할 계획이라면

      Siril Denoise 단계를 건너뛸 수 있습니다.


      원본 SPCC 결과 FITS는 그대로 유지됩니다.

      '
  deblur.what:
    title: Restoration / Deblur
    tooltip: 수동 보정 흐름을 따라 SPCC 다음 Linear 단계에서 Parallax 또는 Siril RL 복원을 수행합니다.
    detail: 'v0.14.0의 기본 엔진은 SyQon Parallax Nano입니다.


      새 기본 순서:

      SPCC → Parallax/Restoration → Prism/Denoise → GHS


      이 순서는 이전 수동 보정 흐름을 최대한 재사용하기 위한 것입니다.


      SyQon을 사용할 수 없는 환경에서는 Siril PSF + Richardson-Lucy 엔진을 Fallback으로 선택할 수 있습니다.'
  deblur.psf:
    title: PSF Source
    tooltip: 현재는 이미지에서 검출한 별을 이용해 PSF를 자동 생성합니다.
    detail: 'PSF(Point Spread Function)는 별 하나가 실제 이미지에서 얼마나 퍼져 보이는지를 나타내는 모델입니다.


      v0.7.0:

      - 기본 방식: Detected Stars

      - Siril 명령: `makepsf stars`


      장점:

      - 실제 이미지의 별 모양을 기반으로 PSF를 만들 수 있습니다.


      한계:

      - 별이 너무 적거나 검출이 어려운 이미지에서는 PSF 생성이 실패할 수 있습니다.

      - Blind / Manual PSF는 향후 선택지로 확장할 수 있습니다.

      '
  deblur.symmetric:
    title: Symmetric PSF
    tooltip: PSF를 대칭 형태로 제한합니다. 비대칭 광학/추적 흐림은 표현하지 못할 수 있습니다.
    detail: 'Siril `makepsf stars -sym` 옵션입니다.


      OFF:

      - 검출된 실제 별 모양의 비대칭성을 PSF에 반영할 수 있습니다.

      - 기본값입니다.


      ON:

      - PSF를 대칭 형태로 제한합니다.

      - 추정이 불안정하거나 비대칭 성분을 복원하고 싶지 않을 때 비교할 수 있습니다.


      주의:

      - 코마, 추적 오차처럼 실제로 비대칭인 흐림을 대칭화하면 복원이 덜 정확할 수 있습니다.

      '
  deblur.kernel:
    title: PSF Kernel Size
    tooltip: PSF 배열의 크기입니다. 비워두면 Siril 기본값을 사용합니다.
    detail: 'Siril `makepsf ... -ks=` 옵션입니다.


      비워두기:

      - Siril 기본값을 사용합니다.

      - v0.7.0 권장 시작 방식입니다.


      직접 지정:

      - PSF가 차지할 정사각 커널 크기를 지정합니다.

      - 너무 작으면 PSF의 날개가 잘릴 수 있고, 너무 크면 계산량이 늘어납니다.


      특별한 이유가 없다면 비워두고 시작하세요.

      '
  deblur.iterations:
    title: RL Iterations
    tooltip: Richardson-Lucy 반복 횟수입니다. 기본 시작값은 10회입니다.
    detail: 'Siril `rl -iters=` 옵션입니다.


      기본 시작값: 10


      높이면:

      - 더 강한 복원 효과가 나타날 수 있습니다.

      - 세부 구조가 선명해질 수 있습니다.

      - 동시에 링잉, 과샤픈, 노이즈 증폭 위험도 커집니다.


      낮추면:

      - 복원 효과가 약해집니다.

      - 보다 보수적인 결과를 얻기 쉽습니다.


      권장:

      - 10회에서 미리보기

      - 과도하면 5~8회

      - 부족하면 조금씩 올려 비교

      '
  deblur.regularization:
    title: Regularization
    tooltip: RL 복원에서 아티팩트와 과도한 증폭을 억제하는 규제 방식을 선택합니다.
    detail: 'Siril RL은 다음 정규화를 선택할 수 있습니다.


      NONE:

      - 정규화 없음

      - 기본값


      TV:

      - Total Variation

      - 평탄 영역의 노이즈 증폭 억제에 도움이 될 수 있습니다.


      FH:

      - Hessian의 Frobenius norm 기반 정규화

      - 곡률/구조를 고려한 규제입니다.


      정규화를 사용하면 Alpha와 함께 동작합니다.

      Siril 문서 기준 Alpha는 값이 낮을수록 정규화가 더 강해집니다.

      '
  deblur.alpha:
    title: Regularization Alpha
    tooltip: TV/FH 정규화 강도를 조절합니다. Siril 기준 낮을수록 더 강한 정규화입니다.
    detail: 'Siril `rl -alpha=` 옵션입니다.


      기본값: 3000


      중요:

      - 일반적인 ''강도'' 슬라이더와 반대로 생각해야 합니다.

      - 값이 낮을수록 더 강한 정규화가 적용됩니다.

      - NONE에서는 Alpha가 사용되지 않습니다.


      처음에는 3000을 유지하고 TV/FH를 선택했을 때만 조정하는 것을 권장합니다.

      '
  deblur.mul:
    title: Multiplicative RL
    tooltip: 기본 Gradient Descent 대신 Multiplicative Richardson-Lucy 방식을 사용합니다.
    detail: 'Siril `rl -mul` 옵션입니다.


      OFF:

      - Siril 기본 Gradient Descent 방식

      - 기본 step size는 Siril이 관리합니다.


      ON:

      - Multiplicative RL 방식 사용


      v0.7.0 기본값은 OFF입니다.

      기본 방식에서 문제가 있을 때 비교용으로 사용하는 것을 권장합니다.

      '
  deblur.preview:
    title: Restoration 미리보기
    tooltip: 빠른 1536px 중심 Crop과 전체 이미지 미리보기를 구분합니다.
    detail: '빠른 미리보기는 원본 픽셀 스케일을 유지한 중앙 약 1536×1536 영역에 Parallax를 실행합니다. Star Level/Sharpen 값을 빠르게 비교하는 용도입니다.


      전체 미리보기는 전체 FITS를 처리하며 실제 적용 전 반드시 확인해야 합니다.


      실행 중에는 상세 로그가 실시간으로 쌓이고 [중단] 버튼으로 Siril/SyQon 프로세스 트리를 종료할 수 있습니다.'
  deblur.apply:
    title: Deblur 승인 후 적용
    tooltip: 미리보기에서 확인한 같은 PSF/RL 설정으로 실제 작업 FITS에 적용합니다.
    detail: '미리보기와 동일한 설정으로 Deconvolution을 실제 작업 파일에 적용합니다.


      결과:

      - `working\06_deblur\{TARGET}_06_deblur.fits`

      - PSF도 같은 폴더에 저장

      - State: DEBLURRED

      - Linear 상태 유지

      - 다음 단계: GHS Stretch

      '
  deblur.skip:
    title: Deblur 건너뛰기
    tooltip: Deconvolution을 적용하지 않고 GHS Stretch 준비 단계로 이동합니다.
    detail: '이미 별과 세부 구조가 충분히 날카롭거나,

      외부 Deblur 도구(예: Parallax / BlurXTerminator 등)를 사용할 계획이라면

      Siril Deconvolution을 건너뛸 수 있습니다.


      현재 Denoise/SPCC 결과 FITS는 그대로 유지됩니다.

      '
  ghs.what:
    title: GHS Stretch
    tooltip: Linear 이미지의 희미한 신호를 보이게 만들면서 밝은 별과 하이라이트를 제어하는 비선형 Stretch입니다.
    detail: 'GHS(Generalised Hyperbolic Stretch)는 밝기 구간을 선택적으로 늘려

      희미한 천체 구조의 대비를 높이는 Stretch 방식입니다.


      이 단계가 중요한 이유:

      - GHS 적용 전: Linear

      - GHS 적용 후: Non-linear


      즉, 이 단계부터 실제 픽셀 밝기 관계가 비선형으로 바뀝니다.


      Siril 문서에서도 GHS는 한 번에 강하게 적용하기보다 작은 조정을 반복적으로 적용하는 방식에 잘 맞는다고 설명합니다.


      AstroSirilAssistant v0.8.0:

      - AutoGHS 권장 시작 모드

      - Manual GHT 고급 모드

      - 미리보기 필수

      - 여러 GHS Pass를 명시적으로 추가 가능

      - 각 Pass를 프로젝트에 기록해 실수로 초기 Stretch를 중복 적용하지 않도록 합니다.

      '
  ghs.method:
    title: GHS Method
    tooltip: AutoGHS는 SP를 이미지 통계에서 자동 계산하고, Manual GHT는 D/B/LP/SP/HP를 직접 지정합니다.
    detail: 'AutoGHS:

      - Siril의 `autoghs` 명령을 사용합니다.

      - SP(Symmetry Point)를 median과 sigma 기준으로 자동 계산합니다.

      - 첫 Stretch의 권장 시작 방식입니다.


      Manual GHT:

      - Siril의 `ght` 명령을 사용합니다.

      - D, B, LP, SP, HP를 직접 설정합니다.

      - 특정 밝기 구간을 정밀하게 다루거나 추가 GHS Pass에 적합합니다.

      '
  ghs.linked:
    title: Linked RGB
    tooltip: AutoGHS의 SP 계산을 RGB 채널별이 아니라 채널 평균 기준으로 연결합니다.
    detail: 'Siril AutoGHS는 기본적으로 채널별로 SP와 Stretch를 계산합니다.


      Linked ON:

      - 채널 평균을 이용해 SP를 계산합니다.

      - OSC 컬러 이미지에서 채널별 Stretch 차이로 색 균형이 흔들리는 것을 줄이는 데 유리할 수 있습니다.


      Linked OFF:

      - 채널별로 독립적인 통계 기준을 사용합니다.


      AstroSirilAssistant의 OSC 기본값은 ON입니다.

      '
  ghs.shadows_clip:
    title: Shadows Clip (kσ)
    tooltip: AutoGHS가 SP를 계산할 때 median에서 몇 sigma 떨어진 지점을 사용할지 정합니다.
    detail: 'AutoGHS의 첫 번째 필수 값입니다.


      SP는 이미지의 median과 sigma 통계를 이용해 계산되며,

      Shadows Clip 값은 그 위치를 정하는 k 값입니다.


      시작값: -2.8


      더 음수로:

      - 더 어두운 쪽을 기준으로 잡는 방향입니다.


      0에 가까워지면:

      - median에 가까운 위치를 기준으로 잡습니다.


      미리보기에서 배경이 과도하게 잘리거나 너무 들뜨지 않는지 확인하세요.

      '
  ghs.d:
    title: D / Stretch Amount
    tooltip: GHS의 전체 Stretch 강도입니다. 0~10 범위이며 값이 커질수록 효과가 강해집니다.
    detail: 'D는 GHS Stretch의 전체 강도를 정합니다.


      Siril 허용 범위: 0~10


      AstroSirilAssistant 시작값: 1.0

      이 값은 Siril의 자동 기본값이 아니라 안전한 첫 미리보기를 위한 앱 시작값입니다.


      높이면:

      - 희미한 신호가 더 빠르게 올라옵니다.

      - 별과 밝은 중심부가 과도하게 커지거나 밝아질 위험이 증가합니다.


      낮추면:

      - 더 보수적인 Stretch가 됩니다.


      GHS는 반복 적용이 가능하므로 한 번에 너무 강하게 올리기보다 작은 Pass를 추가하는 방식을 권장합니다.

      '
  ghs.b:
    title: B
    tooltip: SP 주변에 Stretch 효과를 얼마나 집중할지 조절합니다.
    detail: 'B는 Stretch 효과가 Symmetry Point(SP) 주변에 얼마나 집중되는지를 조절합니다.


      Siril GHT 허용 범위: -5~15


      AutoGHS에서 Siril의 암묵적 기본값은 13입니다.

      이는 SP 주변에 매우 집중된 Stretch를 만듭니다.


      Manual GHT에서는 0이 Siril 기본값입니다.

      '
  ghs.lp:
    title: LP / Low Protection
    tooltip: 0~SP 구간 중 그림자를 선형으로 보존하는 범위를 정합니다.
    detail: 'LP는 Low / Shadow Protection 지점입니다.


      LP와 SP 사이의 설정을 통해 어두운 배경 디테일을 보호합니다.

      Siril 문서에서는 0과 SP 사이에서 Stretch가 선형으로 유지되는 보호 범위를 정의한다고 설명합니다.


      AutoGHS 기본: 0.0


      너무 높이면:

      - 어두운 신호가 충분히 올라오지 않을 수 있습니다.

      '
  ghs.sp:
    title: SP / Symmetry Point
    tooltip: GHS Stretch가 가장 강하게 작용하는 밝기 위치입니다.
    detail: 'SP(Symmetry Point)는 GHS의 핵심 파라미터입니다.


      범위: 0~1


      이 밝기 위치에서 Stretch 효과가 가장 강하게 작용합니다.


      낮은 SP:

      - 어두운 배경/희미한 신호 쪽에 Stretch를 집중합니다.


      높은 SP:

      - 더 밝은 구조 쪽의 대비를 집중적으로 조절합니다.


      AutoGHS에서는 SP를 직접 입력하지 않고 이미지의 median/sigma 통계에서 자동 계산합니다.

      '
  ghs.hp:
    title: HP / Highlight Protection
    tooltip: HP~1 구간을 선형으로 유지해 하이라이트와 별 팽창을 보호합니다.
    detail: 'HP는 Highlight Protection 지점입니다.


      HP와 1 사이에서는 Stretch가 선형으로 유지되어

      밝은 별, 은하 중심부, 성운의 밝은 코어를 보호하는 데 도움을 줍니다.


      AutoGHS의 Siril 암묵적 기본값: 0.7


      낮추면:

      - 더 넓은 밝은 영역을 보호합니다.


      높이면:

      - 보호 구간이 줄어들어 밝은 영역까지 Stretch 효과가 더 들어갑니다.

      '
  ghs.luminance:
    title: Luminance Mode
    tooltip: Manual GHT에서 RGB 밝기를 어떤 방식으로 계산할지 선택합니다.
    detail: 'HUMAN:

      - 사람 눈의 밝기 감도 가중치를 사용합니다.

      - R/G/B 가중치가 동일하지 않습니다.


      EVEN:

      - RGB 채널을 동일 가중치로 평균합니다.


      INDEPENDENT:

      - 각 RGB 채널을 독립적으로 Stretch합니다.


      OSC 이미지에서는 HUMAN 또는 EVEN을 먼저 비교하는 것이 안전합니다.

      INDEPENDENT는 색 균형이 달라질 수 있으므로 주의하세요.

      '
  ghs.clipmode:
    title: Clip Mode
    tooltip: Stretch 후 0~1 범위를 벗어나는 밝은 컬러 픽셀을 어떻게 처리할지 정합니다.
    detail: 'Siril GHS는 다음 clipping mode를 지원합니다.


      rgbblend:

      - Siril GHS의 기본 방식입니다.

      - 밝고 강한 색 영역의 색상 아티팩트를 줄이도록 설계되었습니다.

      - AstroSirilAssistant 기본값입니다.


      clip:

      - 0 미만은 0, 1 초과는 1로 단순 clipping합니다.


      rescale / globalrescale:

      - 범위를 재조정하는 방식입니다.


      특별한 이유가 없다면 rgbblend에서 시작하세요.

      '
  ghs.preview:
    title: GHS 미리보기
    tooltip: 현재 GHS 설정을 임시 복사본에 적용하고 실제 Stretch 결과를 JPEG로 확인합니다.
    detail: 'GHS 미리보기에서는 AutoStretch를 추가로 적용하지 않습니다.


      이유:

      - GHS 자체가 실제 Stretch이기 때문입니다.

      - 미리보기 JPEG는 GHS 결과 그대로 저장됩니다.


      확인할 것:

      - M31 외곽 원반이 충분히 올라왔는지

      - 중심핵이 날아가지 않았는지

      - 별이 과도하게 부풀지 않았는지

      - 배경이 너무 밝아지거나 검게 잘리지 않았는지

      - 색 균형이 유지되는지

      '
  ghs.apply:
    title: GHS 승인 후 적용
    tooltip: 미리보기와 같은 설정으로 실제 작업 FITS에 GHS를 적용하고 Non-linear 상태로 전환합니다.
    detail: '첫 GHS 적용 후:

      - State: STRETCHED

      - image_state.linearity: NONLINEAR

      - image_state.stretched: true

      - GHS Pass 기록 생성


      결과 예:

      `working\07_stretch\M31_07_ghs1.fits`


      이후에는:

      - 추가 GHS Pass

      - 또는 Stretch 완료 후 StarNet

      중 하나를 선택합니다.

      '
  ghs.additional:
    title: 추가 GHS Pass
    tooltip: 이미 Stretch된 이미지에 의도적으로 GHS를 한 번 더 적용합니다. 프로젝트에 별도 Pass로 기록됩니다.
    detail: 'GHS는 반복 적용에 적합합니다.


      AstroSirilAssistant는 첫 Stretch와 추가 Stretch를 구분합니다.


      추가 GHS를 선택하면:

      - 현재 Non-linear 파일을 입력으로 사용

      - `ghs2`, `ghs3`처럼 새로운 파일 저장

      - Pass별 파라미터를 로그에 기록


      따라서 ''초기 Stretch를 실수로 두 번 실행''하는 것과

      ''사용자가 의도적으로 추가 GHS를 실행''하는 것을 구분할 수 있습니다.

      '
  ghs.finish:
    title: Stretch 완료
    tooltip: 현재 Stretch 결과를 확정하고 다음 StarNet / 별 분리 단계로 이동합니다.
    detail: '현재 GHS 결과가 충분하다면 Stretch를 완료합니다.


      다음 단계:

      - StarNet / Stars Separation


      Stretch 완료 후에도 현재 Non-linear FITS가 프로젝트의 current_file로 유지됩니다.

      '
  starnet.what:
    title: StarNet / 별 분리
    tooltip: 현재 Non-linear 이미지에서 별을 제거해 Starless와 Stars 레이어를 분리합니다.
    detail: 'StarNet은 천체사진에서 별을 제거해 배경 천체(은하/성운)와 별을 분리하는 AI 도구입니다.


      AstroSirilAssistant v0.9.0은 Siril 1.4.x의 최신 권장 경로에 맞춰

      내장 legacy `starnet` 명령 대신 Python script wrapper를 사용합니다.


      실행 방식:

      `pyscript StarNet.py ...`


      현재 Siril 공식 StarNet.py는 StarNet2 2.5.0 이상을 지원하며,

      스크립트 소스에는 Windows StarNet2 2.6.2도 테스트 대상으로 명시되어 있습니다.


      현재 처리 위치:

      GHS 완료 / Non-linear → StarNet → Starless + Stars

      '
  starnet.engine:
    title: StarNet Engine
    tooltip: StarNet2 2.5+를 지원하는 Siril Python script 경로를 사용합니다.
    detail: 'Siril 1.4.x에는 legacy StarNet 명령이 남아 있지만,

      Siril 공식 문서는 StarNet 2.5 이상에서는 Python script인 `StarNet.py` 사용을 안내합니다.


      AstroSirilAssistant v0.9.0은:

      - Siril `pyscript StarNet.py`

      - StarNet2 2.5+

      를 기본 경로로 사용합니다.


      사용자의 StarNet2가 표준 설치 경로에 있으면 StarNet.py가 자동 탐색합니다.

      '
  starnet.linear:
    title: Linear Data
    tooltip: 현재 GHS 완료 이미지이므로 OFF로 자동 고정됩니다. StarNet에는 --no-linear로 전달됩니다.
    detail: 'StarNet.py는 Linear 이미지와 이미 Stretch된 이미지를 구분합니다.


      현재 AstroSirilAssistant 워크플로에서는:

      - GHS가 완료됨

      - image_state = NONLINEAR

      이므로 Linear Data는 자동으로 OFF입니다.


      실제 명령:

      `--no-linear`


      사용자가 실수로 Linear 옵션을 켜서 불필요한 pre-stretch/inverse-stretch가 들어가지 않도록

      이 단계에서는 직접 수정할 수 없게 합니다.

      '
  starnet.stride:
    title: Stride
    tooltip: StarNet 타일의 겹침 간격입니다. 망원경 이미지는 Standard 256이 권장 시작값입니다.
    detail: 'StarNet은 이미지를 타일 단위로 처리합니다.

      Stride는 타일 이동 간격을 정합니다.


      Siril 공식 StarNet.py preset:

      - Large: 384 — 초광각/풍경 이미지

      - Standard: 256 — 망원경 이미지

      - Small: 128 — 매우 큰 별에서 도움될 수 있으나 느림


      StarNet 개발자는 기본 256 사용을 강하게 권장합니다.


      DWARF 3로 촬영한 M31 같은 망원경 이미지는 Standard 256에서 시작하는 것이 적합합니다.

      '
  starnet.upsample:
    title: 2x Upsampling
    tooltip: StarNet 처리 전 이미지를 2배 확대합니다. 작은 별 제거에 도움될 수 있지만 처리시간이 크게 늘어납니다.
    detail: '2x Upsampling을 켜면 StarNet 실행 전에 이미지를 2배 확대하고,

      처리 후 원래 크기로 되돌립니다.


      장점:

      - 매우 작고 촘촘한 별의 제거 품질이 좋아질 수 있습니다.


      단점:

      - 처리시간이 크게 증가합니다.

      - Siril 문서 기준 처리량이 약 4배로 늘 수 있습니다.

      - 매우 큰 별에서는 오히려 결과가 나빠질 수 있습니다.


      기본값: OFF

      '
  starnet.highlights:
    title: Protect Highlights
    tooltip: 포화 또는 포화에 가까운 밝은 영역을 Starless 결과에 할당할 때 보호합니다.
    detail: 'StarNet2의 Highlight Protection입니다.


      ON:

      - 밝은 별/핵 주변의 포화 또는 근포화 하이라이트를 보호하는 방향입니다.

      - AstroSirilAssistant 기본값입니다.


      OFF:

      - StarNet2 2.5.3 이상에서만 지원됩니다.


      사용자의 StarNet2 2.6.2에서는 지원되는 옵션입니다.

      '
  starnet.starlayer:
    title: Stars Layer
    tooltip: Original - Starless 방식으로 Stars 레이어를 만듭니다. 이후 Pixel Math의 덧셈 재합성에 적합합니다.
    detail: 'v0.9.0의 기본 Stars 레이어는 Siril StarNet.py의 `subtract` 출력입니다.


      계산 개념:

      Stars = Original - Starless


      이 방식을 기본으로 한 이유:

      이후 Pixel Math에서 다음 형태의 재합성을 사용할 수 있기 때문입니다.


      `Main + Stars * star_weight`


      예:

      `Main + Stars * 0.6`


      이는 이전 M31 수동 보정에서 사용한 재합성 방식과도 잘 맞습니다.

      '
  starnet.native_mask:
    title: Native Starmask
    tooltip: StarNet 자체가 생성한 Starmask도 추가로 저장합니다. 기본 Stars 레이어와는 별도 보조 파일입니다.
    detail: '기본 Stars 레이어(Subtraction) 외에 StarNet의 native starmask를 함께 저장할 수 있습니다.


      기본값: OFF


      이 파일은 이후 마스크 기반 별 조정에 사용할 수 있지만,

      v0.9.0의 기본 Pixel Math 재합성용 Stars 파일은 Subtraction 레이어입니다.

      '
  starnet.preview:
    title: StarNet 미리보기
    tooltip: StarNet을 실제로 한 번 실행해 Starless와 Stars를 임시 생성하고 결과를 확인합니다.
    detail: 'StarNet은 처리 시간이 긴 AI 작업이므로 v0.9.0에서는 효율을 위해

      미리보기에서 만든 결과를 그대로 ''승인 후 적용''에 사용할 수 있습니다.


      미리보기:

      - 임시 Starless FITS

      - 임시 Stars FITS

      - Starless JPEG

      - Stars JPEG

      를 생성합니다.


      승인할 때 설정이 바뀌지 않았다면 StarNet을 다시 계산하지 않고

      미리보기 결과를 프로젝트 작업 폴더로 승격합니다.

      '
  starnet.apply:
    title: StarNet 승인 후 적용
    tooltip: 확인한 미리보기 결과를 Starless/Stars 정식 작업파일로 확정합니다.
    detail: '현재 미리보기와 설정이 동일하면 StarNet을 다시 실행하지 않습니다.


      결과:

      - `working\08_starnet\{TARGET}_08_starless.fits`

      - `working\08_starnet\{TARGET}_08_stars.fits`


      State:

      - STARS_SEPARATED

      - current_file = Starless

      - stars_removed = true


      원래 GHS 결과는 삭제하지 않으며 프로젝트에 source_file로 기록됩니다.

      '
  starnet.skip:
    title: StarNet 건너뛰기
    tooltip: 별 분리를 하지 않고 현재 Non-linear 이미지를 그대로 유지합니다.
    detail: '성단처럼 별 자체가 주대상인 경우 StarNet이 필요하지 않을 수 있습니다.


      이 경우 현재 Stretch 결과를 그대로 유지하고

      별 분리 이후의 Starless/Stars 분기 파이프라인은 사용하지 않습니다.

      '
  recommendation.what:
    title: 천체 특징 기반 추천
    tooltip: 천체 분류/특징과 현재 이미지 통계를 조합해 보수적인 시작값을 추천합니다.
    detail: '추천 시스템은 ''정답값''을 자동 결정하지 않습니다.


      입력 근거:

      - 천체 Category

      - Target Features

      - 현재 처리 단계의 이미지 통계


      출력:

      - 추천 시작값

      - 추천 이유

      - 적용 여부는 사용자가 결정


      v0.10.0은 Starless Processing에 먼저 연결하며 이후 다른 단계에도 같은 엔진을 확장할 수 있습니다.'
  recommendation.features:
    title: 천체 특징
    tooltip: 추천값 계산에 사용하는 천체의 구조적 특징입니다. 자동 제안을 사용자가 수정할 수 있습니다.
    detail: '예: 밝은 중심핵, 먼지띠, 희미한 외곽 구조, 미세 필라멘트, 낮은 표면밝기 등.


      등록된 대표 대상은 이름으로 초기 특징을 제안할 수 있습니다.

      등록되지 않은 대상은 Category 기반 추천을 사용합니다.

      사용자가 수정한 특징은 USER_CONFIRMED로 저장되어 자동 제안보다 우선합니다.'
  starless.what:
    title: Starless Processing
    tooltip: 별이 제거된 천체 본체에만 국부 대비와 채도를 적용합니다.
    detail: '현재 current_file은 Starless 이미지입니다.

      Stars 레이어는 별도 파일로 보존되어 이 단계의 영향을 받지 않습니다.


      v0.10 처리:

      1. CLAHE Local Contrast (선택)

      2. Saturation (선택)


      두 처리 모두 Siril 1.4.4의 scriptable 명령을 사용합니다.'
  starless.clahe:
    title: CLAHE
    tooltip: 작은 영역별 히스토그램을 이용해 Starless의 국부 대비를 높입니다.
    detail: 'CLAHE는 Contrast Limited Adaptive Histogram Equalization입니다.


      Siril 문서에서는 Non-linear 이미지에서 더 잘 작동한다고 안내합니다.

      현재 Starless는 GHS를 마친 Non-linear 데이터이므로 적용 시점이 맞습니다.


      Clip Limit가 높을수록 국부 대비가 강해질 수 있지만 노이즈/아티팩트도 더 강조될 수 있습니다.'
  starless.clahe_clip:
    title: CLAHE Clip Limit
    tooltip: 국부 대비 증폭을 제한하는 값입니다. 높일수록 더 강해질 수 있습니다.
    detail: 'CLAHE에서 평탄한 영역의 대비가 지나치게 증폭되는 것을 제한하는 기준입니다.


      AstroSirilAssistant는 천체 특징에 따라 보수적인 시작값을 추천하고 미리보기 확인을 필수로 합니다.'
  starless.tile:
    title: CLAHE Tile Size
    tooltip: 이미지를 지역으로 나누어 국부 히스토그램을 계산하는 grid 크기입니다.
    detail: 'Siril CLAHE의 tileSize입니다.

      Siril GUI 설명의 기본값은 8입니다.


      더 큰 값은 더 작은 지역 단위의 국부 대비를 다루는 방향이므로 미세 구조에 도움이 될 수 있지만 과도하면 인공적인 질감이 생길 수 있습니다.'
  starless.saturation:
    title: Saturation
    tooltip: Starless 천체 신호의 색 채도를 조절합니다. 0.1은 약 10% 증가 방향입니다.
    detail: 'Siril `satu` 명령을 사용합니다.


      amount:

      - 양수: 채도 증가

      - 음수: 채도 감소

      - 0: 변화 없음

      - 1: 100% 증가


      추천 시스템은 천체 특징에 따라 작은 값부터 시작합니다.'
  starless.background_factor:
    title: Saturation Background Factor
    tooltip: 배경 노이즈까지 채도가 올라가는 것을 줄이기 위한 임계값 계수입니다.
    detail: 'Siril은 median + sigma 기반 임계값을 사용해 일정 밝기 이상의 픽셀에만 채도 처리를 적용할 수 있습니다.


      기본 Siril 값은 1이며, 0으로 설정하면 임계값을 비활성화합니다.'
  starless.preview:
    title: Starless 미리보기
    tooltip: 현재 설정을 임시 Starless에 적용합니다. 이미 Non-linear이므로 추가 AutoStretch를 하지 않습니다.
    detail: '실제 프로젝트 current_file은 변경하지 않습니다.

      CLAHE / Saturation을 임시 복사본에 적용하고 JPEG로 확인합니다.


      확인 포인트:

      - 먼지띠/필라멘트가 자연스럽게 살아나는지

      - 배경이 거칠어지지 않는지

      - 색이 과포화되지 않는지'
  starless.apply:
    title: Starless 승인 후 적용
    tooltip: 미리보기와 동일한 값으로 Starless 정식 작업파일을 생성합니다.
    detail: '결과:

      `working\09_starless\{TARGET}_09_starless_processed.fits`


      적용 후 다음 단계는 Stars Processing입니다.'
  stars.what:
    title: Stars Processing
    tooltip: StarNet에서 분리된 Stars 레이어의 밝기와 채도를 독립적으로 조절합니다.
    detail: 'Stars Processing은 Starless와 분리된 별 레이어만 처리합니다.


      v0.11.0에서 제공하는 조정:

      - Brightness Scale: `fmul`

      - Saturation: `satu`


      이 단계는 별의 시각적 존재감을 줄이거나 색을 조금 살리는 목적입니다.


      중요:

      Brightness Scale은 별의 픽셀 값을 줄이는 기능이며, 실제 별 반경을 형태학적으로 줄이는 Star Reduction은 아닙니다.

      형태 기반 Star Reduction은 안전한 방법을 별도로 검증한 뒤 추가하는 편이 좋습니다.'
  stars.brightness:
    title: Stars Brightness Scale
    tooltip: Stars 레이어 전체를 곱셈으로 밝게/어둡게 합니다. 0.6이면 별 신호를 60%로 줄입니다.
    detail: 'Siril `fmul scalar` 명령을 사용합니다.


      예:

      - 1.0 = 변화 없음

      - 0.8 = 별 신호를 80%로

      - 0.6 = 별 신호를 60%로

      - 1.1 = 별을 약간 더 밝게


      이 레이어는 이후 Main에 더해지는 additive Stars 레이어이므로,

      밝기 Scale은 최종 별 존재감에 직접적인 영향을 줍니다.


      M31처럼 희미한 외곽 구조와 밝은 별이 함께 있는 대상에서는 1보다 작은 값을 시작점으로 사용하는 경우가 많습니다.'
  stars.saturation:
    title: Stars Saturation
    tooltip: 별색의 채도를 조절합니다. 0.08은 약 8% 증가 방향입니다.
    detail: 'Siril `satu` 명령을 사용해 Stars 레이어의 색을 조정합니다.


      Amount:

      - 양수: 채도 증가

      - 음수: 채도 감소

      - 0: 변화 없음

      - 1: 100% 증가


      Stars 레이어의 배경은 거의 검정이므로 v0.11 기본 Background Factor는 0입니다.

      이는 배경 threshold를 끄고 별 신호 전체에 동일하게 적용하기 위한 시작값입니다.'
  stars.recommendation:
    title: 별 특징 기반 추천
    tooltip: 천체가 별보다 본체 구조가 중요한지, 별 자체가 주대상인지에 따라 별 밝기 시작값을 다르게 추천합니다.
    detail: '추천 엔진은 천체 Category와 Features를 이용합니다.


      예:

      - 은하/성운: 별 존재감을 줄여 본체 구조를 강조하는 방향

      - 산개성단/구상성단: 별 자체가 대상이므로 밝기 감소를 최소화

      - 저표면밝기/희미한 외곽 구조: 별 밝기를 더 낮추는 방향

      - 높은 별 밀도: 밝기와 채도를 조금 낮추는 방향


      현재 Stars 레이어의 하이라이트 통계도 작은 범위에서 보정값에 반영합니다.


      항상 ''추천 시작값''이며 자동 확정하지 않습니다.'
  stars.preview:
    title: Stars 미리보기
    tooltip: 현재 밝기/채도 설정을 임시 Stars 레이어에 적용해 JPEG로 확인합니다.
    detail: '현재 정식 Stars 파일은 변경하지 않습니다.


      Stars는 이미 Non-linear 레이어이므로 미리보기 JPEG에 AutoStretch를 추가하지 않습니다.


      확인할 것:

      - 너무 많은 별이 사라진 느낌이 없는지

      - 별색이 과포화되지 않는지

      - 밝은 별이 지나치게 약해지지 않는지'
  stars.apply:
    title: Stars 승인 후 적용
    tooltip: 미리보기와 같은 설정으로 정식 Stars Processing FITS를 생성합니다.
    detail: '결과:

      `working\10_stars\{TARGET}_10_stars_processed.fits`


      Main/Starless 파일은 변경하지 않습니다.


      다음 단계:

      Pixel Math Recombine'
  ui.dynamic:
    title: Astro Graphite / 반응형 UI
    tooltip: v0.14는 두 GUI에 동일한 Astro Graphite 테마와 반응형 작업/로그 레이아웃을 사용합니다.
    detail: 'v0.14 UI 공통 정책:


      - 고정된 Windows 기본 느낌 대신 Graphite/Navy 기반 Dark UI

      - Segoe UI 중심의 깔끔한 타이포그래피

      - Accent / Success 버튼 구분

      - Project / Task 단위 Card 구조

      - 화면 해상도 기반 초기 크기

      - 실제 Overflow에서만 세로 스크롤

      - 로그 기본 접힘

      - 로그를 열면 Resizable Pane

      - 처리 중 Progress + 경과시간

      - 처리 중 입력/버튼 잠금

      - 오류 시 상세 로그 자동 열기


      run_gui.bat와 run_sequence_gui.bat 모두 같은 UI 정책을 사용합니다.'
  recombine.what:
    title: Pixel Math Recombine
    tooltip: Main/Starless와 Stars additive layer를 Pixel Math로 다시 합칩니다.
    detail: 'Siril 1.4.4의 scriptable `pm` 명령을 사용합니다.


      기본 표현식:

      `$Main$ + $Stars$ * star_weight`


      Pixel Math 변수는 작업 폴더의 이미지 이름을 `$...$`로 감싸 사용합니다.


      v0.12.0은 Main/Stars를 임시 작업폴더에 복사해 `Main.fits`, `Stars.fits`라는 안정적인 변수명으로 계산합니다.'
  recombine.weight:
    title: Star Weight
    tooltip: 재합성할 Stars 레이어의 최종 가중치입니다. 1.0은 현재 Stars 레이어를 그대로 더합니다.
    detail: 'Star Weight는 Recombine 단계의 추가 곱셈값입니다.


      중요:

      Stars Processing 단계에서 이미 Brightness Scale을 적용했다면 그 효과가 Stars FITS에 들어 있습니다.


      예:

      Stars Processing Brightness = 0.6

      Recombine Star Weight = 1.0

      → 원본 subtraction Stars 대비 실질 약 0.6


      같은 상황에서 Star Weight를 다시 0.6으로 두면

      → 실질 약 0.36

      가 되므로 별이 예상보다 많이 약해질 수 있습니다.


      그래서 보정된 Stars를 사용하는 경우 기본 추천은 1.0입니다.'
  recombine.nosum:
    title: -nosum
    tooltip: Main과 Stars의 노출시간 메타데이터를 합산하지 않습니다.
    detail: 'Pixel Math의 `-nosum` 옵션을 항상 사용합니다.


      Main과 Stars는 서로 다른 두 촬영 결과가 아니라 같은 촬영 데이터에서 분리된 레이어입니다.

      노출시간/LIVETIME/STACKCNT를 단순 합산하면 메타데이터 의미가 왜곡될 수 있으므로 v0.12에서는 `-nosum`을 고정 사용합니다.'
  recombine.rescale:
    title: Rescale Output
    tooltip: Pixel Math 결과를 0~1 범위로 다시 매핑합니다. 기본은 OFF입니다.
    detail: 'Siril `pm`의 `-rescale 0 1` 옵션입니다.


      OFF (권장 시작):

      - Main과 Stars의 상대적인 픽셀 값을 그대로 합칩니다.

      - 기존 톤 관계를 보존하기 쉽습니다.


      ON:

      - 최종 계산 결과 전체를 0~1로 다시 매핑합니다.

      - clipping을 피할 수 있지만 전체 명암/색 관계가 바뀔 수 있습니다.


      따라서 기본 OFF이며, 먼저 Star Weight를 조절해 하이라이트를 관리하는 것을 권장합니다.'
  recombine.preview:
    title: Recombine 미리보기
    tooltip: Pixel Math 결과를 임시 FITS/JPEG로 만들고 clipping 통계를 확인합니다.
    detail: '미리보기는 실제 작업파일을 변경하지 않습니다.


      출력:

      - 임시 Recombined FITS

      - 표시용 JPEG

      - highlight clipping 통계


      이미 Non-linear이므로 추가 AutoStretch는 하지 않습니다.


      설정이 바뀌지 않으면 승인 후 적용 시 미리보기 FITS를 그대로 정식 결과로 승격합니다.'
  recombine.apply:
    title: Recombine 승인 후 적용
    tooltip: 확인한 Pixel Math 결과를 정식 Recombined FITS로 확정합니다.
    detail: '결과:

      `working\11_recombine\{TARGET}_11_recombined.fits`


      State:

      `RECOMBINED / NONLINEAR`


      이후 다음 단계:

      Final / Export'
  final.what:
    title: Final / Export
    tooltip: 최종 Recombined 이미지를 검토하고 FITS / TIFF / PNG로 저장합니다.
    detail: 'Final / Export는 기본 파이프라인의 마지막 단계입니다.


      입력:

      - RECOMBINED / NONLINEAR


      출력:

      - Working Final FITS

      - 선택적 32-bit FITS

      - 선택적 16-bit TIFF

      - 선택적 16-bit PNG

      - 최종 확인용 JPEG


      최종 파일명은 `{TARGET}_final_Auto` 규칙을 사용합니다.'
  final.fits:
    title: Final FITS 32-bit
    tooltip: Siril 내부 32-bit float 경로로 최종 FITS를 저장합니다.
    detail: 'Siril `set32bits` 후 `save`를 사용합니다.


      기본 출력:

      `output\fits\{TARGET}_final_Auto.fits`


      FITS는 이후 재처리/과학적 데이터 보존용 최종본으로 적합합니다.'
  final.tiff:
    title: Final TIFF 16-bit
    tooltip: Siril `savetif`로 16-bit per channel TIFF를 저장합니다.
    detail: 'Siril 1.4.4의 `savetif`는 16-bit per channel TIFF를 저장합니다.


      기본 출력:

      `output\tiff\{TARGET}_final_Auto.tif`


      Deflate를 켜면 무손실 압축을 사용합니다.


      Photoshop 등 외부 이미지 편집기로 넘기기 좋은 포맷입니다.'
  final.png:
    title: Final PNG 16-bit
    tooltip: 32-bit/16-bit 입력에서 Siril `savepng`는 16-bit per channel PNG를 저장합니다.
    detail: 'Siril `savepng`를 사용합니다.


      기본 출력:

      `output\png\{TARGET}_final_Auto.png`


      현재 Siril 소스가 32-bit이므로 16-bit per channel PNG로 저장됩니다.


      주의:

      v0.13.0은 PNG에 ICC/sRGB 프로파일을 강제로 변환/삽입하지 않습니다.

      필요하면 Photoshop 등 색관리 가능한 프로그램에서 최종 sRGB 변환을 수행하세요.'
  final.checksum:
    title: FITS Checksum
    tooltip: FITS CHECKSUM/DATASUM 키워드를 추가합니다.
    detail: 'Siril `save ... -chksum` 옵션입니다.


      ON이면 FITS 헤더에 CHECKSUM / DATASUM 검증 정보를 저장합니다.


      기본값: ON'
  final.deflate:
    title: TIFF Deflate
    tooltip: 16-bit TIFF를 무손실 Deflate 압축으로 저장합니다.
    detail: 'Siril `savetif ... -deflate` 옵션입니다.


      이미지 데이터는 손실 없이 압축됩니다.


      기본값: ON'
  final.preview:
    title: Final 미리보기
    tooltip: 현재 Recombined 픽셀을 변경하지 않고 JPEG와 clipping 통계로 최종 확인합니다.
    detail: 'Final 미리보기는 픽셀 보정을 추가하지 않습니다.


      - AutoStretch 없음

      - 현재 Recombined 이미지 그대로 JPEG 생성

      - highlight clipping 통계 계산


      이 결과를 확인한 뒤 승인 후 Export를 진행합니다.'
  final.apply:
    title: Finalize + Export
    tooltip: Working Final과 선택한 최종 출력 파일을 생성하고 프로젝트를 EXPORTED 상태로 완료합니다.
    detail: '생성 예:


      `working\12_final\M31_12_final.fits`


      `output\fits\M31_final_Auto.fits`

      `output\tiff\M31_final_Auto.tif`

      `output\png\M31_final_Auto.png`


      완료 State:

      `EXPORTED`


      다음:

      기본 파이프라인 완료'
  deblur.engine:
    title: Restoration Engine
    tooltip: 기본은 SyQon Parallax이며, 필요하면 기존 Siril Richardson-Lucy로 전환할 수 있습니다.
    detail: 'SYQON_PARALLAX

      - 이전 수동 보정에서 사용한 Parallax.py를 Siril `pyscript`로 호출합니다.

      - Linear 이미지 상태를 유지한 채 결과를 다시 Siril 메모리 이미지로 돌려받고 FITS로 저장합니다.


      SIRIL_RL

      - 기존 AstroSirilAssistant의 makepsf + Richardson-Lucy 처리입니다.

      - SyQon script/model이 없거나 결과 비교가 필요할 때 사용합니다.'
  deblur.parallax:
    title: SyQon Parallax
    tooltip: Parallax Nano의 수차 보정, 별 처리, 미세 구조 복원을 사용하는 기본 Restoration 엔진입니다.
    detail: 'AstroSirilAssistant는 Siril Python script의 CLI/programmatic 모드를 사용합니다.


      기본 시작값:

      - Edition: Nano

      - Aberration Correction: ON

      - Star Level: 3

      - Sharpen: 1

      - Tile: 512

      - Overlap: 64

      - Pad: 96

      - Temporary MTF: ON

      - MTF Target: 0.25

      - Linked: OFF

      - GPU: ON


      이는 현재 Parallax script의 기본 성격을 따라 잡은 재현 가능한 시작점이며 천체별 절대 최적값은 아닙니다.'
  deblur.parallax.star:
    title: Parallax Star Level
    tooltip: Parallax의 별 처리 강도입니다. Nano에서는 v0.14 UI가 0~5 범위를 사용합니다.
    detail: '0이면 별 처리 효과를 끄는 방향입니다.


      현재 공식 Parallax source는 CLI에서 Nano 최대 5, Pro 최대 7로 clamp합니다.


      밝은 별이 많은 대상에서는 높은 값이 지나치게 공격적일 수 있으므로 미리보기를 확인하세요.'
  deblur.parallax.sharpen:
    title: Parallax Sharpen
    tooltip: Parallax CLI에 전달하는 Sharpen 강도 시작값입니다.
    detail: '기본값은 1.0입니다.


      높일수록 미세 구조가 더 선명해질 수 있지만 노이즈와 경계 아티팩트도 함께 강조될 수 있습니다.


      현재 앱은 Script 내부 알고리즘을 다시 구현하지 않고 공식 Parallax.py에 값을 전달합니다.'
  deblur.parallax.geometry:
    title: Parallax Tile / Overlap / Pad
    tooltip: AI 추론 타일 크기와 겹침/경계 패딩입니다.
    detail: '기본:

      512 / 64 / 96


      일반적으로 기본값을 유지하는 것을 권장합니다.

      큰 이미지는 Parallax 자체가 하드웨어 상황에 따라 내부 최적화를 수행할 수 있습니다.'
  deblur.parallax.mtf:
    title: Parallax Temporary MTF
    tooltip: Linear AI 처리를 위한 Parallax 내부 임시 MTF stretch 설정입니다.
    detail: 'Parallax는 Linear 데이터를 처리하기 위해 내부적으로 임시 MTF를 사용할 수 있습니다.


      기본:

      - MTF ON

      - Target 0.25

      - Linked OFF


      최종 결과는 Linear 상태로 되돌아와 다음 Prism/GHS 단계로 이어집니다.'
  deblur.native:
    title: Siril RL Fallback
    tooltip: 별 기반 PSF와 Richardson-Lucy를 사용하는 기존 네이티브 복원 엔진입니다.
    detail: '기존 AstroSirilAssistant v0.7 계열 엔진입니다.


      - makepsf stars

      - rl

      - 반복 횟수 / 정규화 / Alpha / Multiplicative 조절


      SyQon과 결과를 비교하거나 Parallax 실행 환경이 준비되지 않았을 때 사용할 수 있습니다.'
  denoise.engine:
    title: Denoise Engine
    tooltip: 기본은 SyQon Prism이며 기존 Siril Denoise를 Fallback으로 선택할 수 있습니다.
    detail: 'SYQON_PRISM

      - 이전 수동 보정에서 사용한 Prism.py를 Siril `pyscript`로 호출합니다.


      SIRIL_NATIVE

      - 기존 `denoise` 명령을 사용합니다.


      엔진을 바꾸면 미리보기 승인이 무효화되므로 새 미리보기를 확인해야 합니다.'
  denoise.prism:
    title: SyQon Prism
    tooltip: AI 기반 Noise Reduction을 수행하는 기본 Denoise 엔진입니다.
    detail: '기본 시작값:

      - Model: Mini

      - Tile: 512

      - Overlap: 96

      - Pad: 96

      - Modulation: 1.0

      - GPU: ON

      - Temporary Stretch: Statistical

      - Target: 0.25


      Prism script와 모델은 Siril 쪽에 설치되어 있어야 합니다.'
  denoise.prism.modulation:
    title: Prism Modulation
    tooltip: 원본과 Denoise 결과의 혼합 비율입니다. 1.0은 전체 Denoise 결과를 사용합니다.
    detail: '0.0 = 원본

      1.0 = Prism Denoise 결과 전체


      미세 구조가 지나치게 부드러워 보이면 1보다 낮은 값으로 비교해볼 수 있습니다.'
  denoise.prism.geometry:
    title: Prism Tile / Overlap / Pad
    tooltip: Prism AI 추론의 타일 크기와 겹침/경계 패딩입니다.
    detail: 'v0.14 기본:

      512 / 96 / 96


      타일 경계 아티팩트나 메모리 문제가 없다면 기본값 유지가 권장됩니다.'
  denoise.prism.stretch:
    title: Prism Temporary Stretch
    tooltip: Linear Denoise를 위해 Prism 내부에서 사용하는 임시 stretch 방법/target입니다.
    detail: '기본:

      Statistical / 0.25


      이는 최종 GHS Stretch가 아닙니다.

      Prism 내부 AI 처리용으로 잠시 stretch하고 inverse 처리하여 Linear 결과로 돌아옵니다.'
  denoise.native:
    title: Siril Native Denoise Fallback
    tooltip: 기존 AstroSirilAssistant의 Siril `denoise` 엔진입니다.
    detail: '기존 옵션:

      - Modulation

      - Cosmetic Correction

      - DA3D

      - Independent RGB


      Prism이 준비되지 않았거나 결과 비교가 필요할 때 사용할 수 있습니다.'
  workflow.manual_inspired:
    title: Manual-inspired SyQon Workflow
    tooltip: 예전에 수동으로 사용하던 Parallax/Prism 흐름을 기본 반자동 순서에 반영합니다.
    detail: 'v0.14부터 Single Image 기본 Linear 후처리 순서는:


      Gradient → SPCC → Parallax Restoration → Prism Denoise → GHS


      입니다.


      Parallax와 Prism은 앱 내부에서 비슷하게 흉내 내는 것이 아니라 Siril의 `pyscript`를 통해 설치된 SyQon Python script를 직접 호출합니다.


      각 단계에는 기존 Siril Native 엔진을 Fallback으로 남겨 비교/복구가 가능하게 했습니다.'
  ui.cancel:
    title: 실행 중단
    tooltip: 실행 중인 Siril/SyQon 작업을 안전하게 중단 요청합니다.
    detail: 'Progress가 실행 중일 때 [중단] 버튼이 활성화됩니다.


      중단 시 실행 중인 Siril 프로세스와 하위 프로세스를 종료하고, 완료되지 않은 미리보기 파일은 재사용하지 않습니다. 적용 작업은 정상 완료 전에 프로젝트 state를 완료 상태로 갱신하지 않습니다.'
  ui.guide:
    title: AstroSirilAssistant 사용 도움말
    tooltip: 프로젝트 입력과 주요 버튼의 역할을 설명합니다.
    detail: |
      프로젝트 시작 순서

      1. [찾기]에서 FITS 이미지를 선택합니다.
      2. 헤더에 OBJECT / DATE-OBS가 있으면 대상명과 촬영일을 자동으로 채웁니다.
      3. [이미지 분석]으로 픽셀 통계, Linear 상태, Siril 메타데이터를 확인합니다.
      4. 분석이 완료되면 [프로젝트 생성]이 활성화됩니다.
      5. 프로젝트 생성 후 화면의 현재 단계 설명과 추천값을 확인하며 보정을 진행합니다.

      주요 입력

      - 이미지: 처리할 FITS 원본입니다. 경로는 직접 수정하지 않고 [찾기]에서 선택합니다.
      - 대상명: FITS OBJECT 값을 우선 사용하며, 없으면 직접 입력합니다.
      - 촬영일: FITS DATE-OBS 값을 우선 사용합니다.
      - 대상 종류: 알려진 대상이면 자동 분류하고, 알 수 없으면 '기타 / 직접입력'으로 표시합니다.
      - 저작권: 선택 입력값입니다. 프로젝트에 보관되며 Final FITS의 COPYRGHT 헤더에 기록됩니다.
      - 저장 위치: 프로젝트가 생성될 상위 폴더입니다. [폴더]에서 선택합니다.

      버튼

      - Siril 연결 확인: 설치된 Siril CLI 경로와 버전을 확인합니다.
      - SyQon 설치 확인: Parallax / Prism script 감지 여부를 확인합니다.
      - 이미지 분석: 프로젝트 생성 전 입력 이미지를 분석합니다.
      - 프로젝트 생성: 분석 완료된 이미지로 Auto_<대상>_<날짜> 프로젝트를 만듭니다.
      - 기존 프로젝트 열기: 이전 작업의 project.yaml을 불러옵니다.

      각 보정 단계의 [도움말]에서는 해당 입력값의 의미와 결과에 미치는 영향을 설명합니다.
  project.copyright:
    title: 저작권 메타데이터
    tooltip: 선택 입력입니다. Final FITS에 저작권 정보를 기록할 수 있습니다.
    detail: |
      사진의 저작권자/표기 문구를 선택적으로 입력합니다.

      예:
      © 2026 Photographer Name

      입력값은 project.yaml에 보관되고 Final Export 시 Working FITS와 Final FITS의 COPYRGHT 헤더에 기록됩니다.

      현재 TIFF / PNG에는 이 값을 강제로 삽입하지 않습니다. 이미지 위에 보이는 워터마크를 그리는 기능도 아닙니다.
