      Pixel Math Recombine'
  ui.dynamic:
    title: 동적 / 반응형 UI
    tooltip: 창 크기에 맞춰 작업영역을 스크롤하고 로그를 별도 리사이즈 가능한 Pane으로 표시합니다.
    detail: 'v0.11.0 UI는 고정 세로 길이에 의존하지 않습니다.


      구성:

      - 화면 해상도에 맞춘 초기 창 크기

      - 작업영역 전체 세로 스크롤

      - 로그는 기본 접힘

      - 로그를 열면 아래쪽에 독립 Pane으로 표시

      - 작업영역/로그 경계선을 드래그해 높이 조절

      - 창 크기를 변경하면 내부 폭도 자동 재배치


      따라서 노트북처럼 세로 해상도가 낮은 화면에서도 아래 버튼/로그가 화면 밖으로 잘리는 문제를 줄입니다.'
