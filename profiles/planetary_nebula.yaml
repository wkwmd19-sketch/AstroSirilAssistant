schema_version: '0.2'
profile:
  id: PLANETARY_NEBULA
  display_name: Planetary Nebula
  applies_to:
    categories:
    - PLANETARY_NEBULA
  priorities:
    preserve_highlights: VERY_HIGH
    preserve_faint_structure: MEDIUM
    preserve_star_color: MEDIUM
    color_accuracy: HIGH
  default_pipeline:
  - GRADIENT_CORRECTION
  - COLOR_CALIBRATION
  - DEBLUR
  - DENOISE
  - GHS_STRETCH
  - OPTIONAL_STARNET
  - FINAL_CURVES
  stretch:
    default_strength_class: LOW_MEDIUM
    adaptive: true
    require_preview: true
  starnet:
    default_enabled: false
    decision: PROFILE_PLUS_IMAGE_ANALYSIS
  special_rules:
    small_bright_target: true
    core_highlight_guard: VERY_HIGH
    deblur_priority: HIGH
