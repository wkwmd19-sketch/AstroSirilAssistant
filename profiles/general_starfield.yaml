schema_version: '0.2'
profile:
  id: GENERAL_STARFIELD
  display_name: General Star Field
  applies_to:
    categories:
    - GENERAL_STARFIELD
  priorities:
    preserve_highlights: VERY_HIGH
    preserve_faint_structure: LOW
    preserve_star_color: VERY_HIGH
    color_accuracy: VERY_HIGH
  default_pipeline:
  - GRADIENT_CORRECTION
  - COLOR_CALIBRATION
  - DENOISE
  - GHS_STRETCH
  - FINAL_CURVES
  stretch:
    default_strength_class: LOW
    adaptive: true
    require_preview: true
  starnet:
    default_enabled: false
    decision: PROFILE_PLUS_IMAGE_ANALYSIS
  special_rules:
    star_color_priority: VERY_HIGH
    avoid_star_bloat: true
