      - "상태머신"
      - "캘리브레이션 연동"
      - "작업 추천/설명"
    planned_next:
      - "실제 trail composition 엔진"
      - "gap 검출"
      - "비행기/위성 흔적 후보 감지"
      - "프레임 제외 UI"
