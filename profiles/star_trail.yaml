      pipeline:
        - "CALIBRATION_CHECK"
        - "FRAME_QUALITY_CHECK"
        - "STAR_TRAIL_COMPOSE"
        - "FINALIZE"
      notes:
        - "별 정렬을 수행하지 않습니다."
        - "프레임 간 시간 간격(gap)을 확인합니다."
        - "비행기/위성/구름/심한 흔들림 프레임을 검토합니다."

    STAR_TRAIL_LANDSCAPE:
      description: "산, 나무, 건물 등 지상 풍경이 포함된 별 일주사진"
      pipeline:
        - "CALIBRATION_CHECK"
        - "FRAME_QUALITY_CHECK"
        - "STAR_TRAIL_COMPOSE"
        - "FINALIZE"
