schema_version: '0.1'
feature_labels:
  BRIGHT_CORE: 밝은 중심핵
  FAINT_OUTER_STRUCTURE: 희미한 외곽 구조
  DUST_LANES: 먼지띠
  LOW_SURFACE_BRIGHTNESS: 낮은 표면밝기
  FINE_FILAMENTS: 미세 필라멘트
  STRONG_EMISSION: 강한 방출선 구조
  REFLECTION_BLUE: 푸른 반사성운 구조
  COMPACT_HIGH_SURFACE_BRIGHTNESS: 작고 밝은 구조
  HIGH_DYNAMIC_RANGE: 높은 다이내믹레인지
  WIDE_DIFFUSE: 넓고 확산된 구조
  SPIRAL_ARMS: 나선팔 구조
  HIGH_STAR_DENSITY: 높은 별 밀도
category_labels:
