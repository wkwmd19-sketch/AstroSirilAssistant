    HIGH_DYNAMIC_RANGE:
      brightness_delta: -0.05
      reason: 밝은 별/핵과 희미한 구조의 균형을 위해 별 밝기를 보수적으로 낮춤
    HIGH_STAR_DENSITY:
      brightness_delta: -0.1
      saturation_delta: -0.02
      reason: 별 밀도가 높은 장면에서 별이 과도하게 지배하지 않도록 밝기/채도를 낮춤
