      clahe_tile_size: 8
      saturation_enabled: true
      saturation_amount: 0.05
      saturation_background_factor: 1.2
      saturation_hue_range: 6
  feature_modifiers:
    BRIGHT_CORE:
      clahe_clip_delta: -0.15
      saturation_delta: -0.02
      reason: 밝은 중심핵 보호를 위해 국부 대비와 채도 강도를 조금 낮춤
    FAINT_OUTER_STRUCTURE:
      clahe_clip_delta: 0.15
      reason: 희미한 외곽 구조를 보이기 위해 국부 대비를 소폭 강화
    DUST_LANES:
      clahe_clip_delta: 0.15
      tile_min: 12
      reason: 먼지띠의 국부 대비를 조금 더 살리는 방향
    LOW_SURFACE_BRIGHTNESS:
      clahe_clip_delta: 0.1
      saturation_delta: -0.02
      background_factor_delta: 0.1
      reason: 저표면밝기 신호는 색 노이즈 과증폭을 피하면서 구조 대비를 소폭 강화
    FINE_FILAMENTS:
      clahe_clip_delta: 0.2
      tile_min: 16
      reason: 미세 필라멘트의 국부 구조를 강조하는 방향
    STRONG_EMISSION:
      saturation_delta: 0.05
      reason: 강한 방출선 색 구조를 조금 더 살리는 방향
    REFLECTION_BLUE:
      saturation_delta: 0.02
      reason: 반사성운의 색 차이를 소폭 강화
    COMPACT_HIGH_SURFACE_BRIGHTNESS:
      clahe_clip_delta: -0.15
      tile_max: 8
      reason: 작고 밝은 구조의 과도한 국부 대비를 억제
    HIGH_DYNAMIC_RANGE:
      clahe_clip_delta: -0.1
      saturation_delta: -0.01
      reason: 밝은 영역과 희미한 영역의 동시 보존을 위해 보수적으로 조정
    WIDE_DIFFUSE:
      tile_max: 8
      reason: 넓은 확산 구조를 너무 잘게 분할하지 않도록 타일 수를 낮춤
    SPIRAL_ARMS:
      clahe_clip_delta: 0.1
      reason: 나선팔/먼지 구조의 국부 대비를 소폭 강화
    HIGH_STAR_DENSITY:
      saturation_delta: -0.02
      reason: 별 잔여/색 노이즈가 과장되지 않도록 채도를 조금 낮춤
limits:
  saturation_amount:
