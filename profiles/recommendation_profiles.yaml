    FAINT_OUTER_STRUCTURE:
      weight_delta: -0.05
      reason: 희미한 외곽 구조를 별이 가리지 않도록 재합성 별 가중치를 소폭 낮춤
    LOW_SURFACE_BRIGHTNESS:
      weight_delta: -0.1
      reason: 저표면밝기 천체 신호를 보호하기 위해 별 가중치를 낮춤
    FINE_FILAMENTS:
