$schema: "https://json-schema.org/draft/2020-12/schema"
title: "AstroSirilAssistant Processing Log Schema v0.2"
type: object
required: ["schema_version", "project_id", "entries"]

properties:
  schema_version:
    const: "0.2"

  project_id:
    type: string

  entries:
    type: array
    items:
      type: object
      required:
        - "timestamp"
        - "step_id"
        - "input_file"
        - "status"
      properties:
        timestamp: {type: string}
        step_id: {type: string}
        executor: {type: string}
        command: {type: ["string", "null"]}
        input_file: {type: string}
        output_file: {type: ["string", "null"]}
        status:
          enum: ["SUCCESS","FAILED","SKIPPED","CANCELLED"]
        parameters: {type: object}
        analysis_before: {type: object}
        analysis_after: {type: object}
        recommendation:
          type: object
          properties:
            summary: {type: string}
            reason: {type: string}
            confidence:
              type: number
              minimum: 0
              maximum: 1
        user_decision:
          type: object
          properties:
            action: {type: string}
            override: {type: boolean}
        stdout: {type: ["string", "null"]}
        stderr: {type: ["string", "null"]}
        notes: {type: ["string", "null"]}
