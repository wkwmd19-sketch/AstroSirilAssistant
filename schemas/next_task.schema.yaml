$schema: "https://json-schema.org/draft/2020-12/schema"
title: "AstroSirilAssistant Next Task UI Schema"
type: object
required: ["task_id", "title", "summary", "purpose", "current_status", "recommendations", "cautions", "completion_criteria", "actions"]
properties:
  task_id: {type: string}
  title: {type: string}
  summary: {type: string}
  purpose: {type: string}
  current_status: {type: string}
  recommendations: {type: object}
  cautions: {type: array, items: {type: string}}
  completion_criteria: {type: array, items: {type: string}}
  actions:
    type: array
    items: {type: string, enum: ["RUN", "EDIT", "PREVIEW", "SKIP", "RECALCULATE", "CONFIRM"]}
