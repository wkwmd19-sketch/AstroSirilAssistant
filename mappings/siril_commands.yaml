schema_version: "0.7.0"

command_mapping:
  target_siril: "1.4.4"

  SEQUENCE_CONVERT:
    executor: "SIRIL_NATIVE"
    command_template: 'convert {basename} -fitseq "-out={output_dir}"'
    notes:
      - "FITS/RAW 등 Siril 지원 입력을 sequence로 변환"
      - "v0.4 실행 엔진은 우선 FITS sequence 입력을 공식 지원"

  CALIBRATE_SEQUENCE:
    executor: "SIRIL_NATIVE"
    command_template: 'calibrate {sequence} {master_args} {cfa_args} -fitseq'
    notes:
      - "Siril 1.4.4의 calibrate 명령 사용"

  REGISTER_DEEPSKY_2PASS:
    executor: "SIRIL_NATIVE"
    commands:
      - 'register {sequence} -2pass'
      - 'seqapplyreg {sequence} -prefix=r_ -framing=min'
    notes:
      - "2pass는 변환 데이터만 계산하므로 seqapplyreg를 이어서 실행"

  STACK_DEEPSKY:
    executor: "SIRIL_NATIVE"
    command_template: 'stack {sequence} rej winsorized 3 3 -norm=addscale -weight=wfwhm "-out={output_stem}" -32b'

  STARNET_STABLE:
    executor: "SIRIL_NATIVE"
    command_template: 'starnet {options}'
    stable_supported: "1.4.4"
    notes:
      - "Siril 1.4.4 stable에는 scriptable starnet 명령이 존재"
      - "linear 입력에는 -stretch 옵션 사용 가능"

  GRADIENT_CORRECTION:
    executor: "SIRIL_NATIVE"
    command_template: "subsky -rbf -samples={samples} -tolerance={tolerance} -smooth={smooth} {optional_dither}"
    stable_supported: "1.4.4"
    implementation_status: "IMPLEMENTED_V0.4.2"
    defaults:
      samples: 20
      tolerance: 1.0
      smooth: 0.5
      dither: false
    safety:
      require_linear: true
      require_preview_same_parameters_before_gui_apply: true

  SPCC:
    executor: "SIRIL_NATIVE"
    command_family: "spcc"
    implementation_status: "NEXT_AFTER_PREPROCESS"

  GHS:
    executor: "SIRIL_NATIVE"
    command_family: "ght"
    implementation_status: "NEXT_AFTER_PREPROCESS"

  PIXELMATH_RECOMBINE:
    executor: "SIRIL_NATIVE"
    command_family: "pm"
    implementation_status: "NEXT_AFTER_PREPROCESS"


DENOISE:
  executor: "SIRIL_NATIVE"
  command_template: "denoise -mod={modulation} {optional_nocosmetic} {optional_da3d} {optional_indep}"
  stable_supported: "1.4.4"
  implementation_status: "IMPLEMENTED_V0.6.0"
  defaults:
    modulation: 1.0
    cosmetic_correction: true
    da3d: false
    independent_channels: false
  notes:
    - "VST is intentionally omitted from the default stacked-image UI."
    - "Preview is required before GUI apply."


DEBLUR:
  executor: "SIRIL_NATIVE"
  implementation_status: "IMPLEMENTED_V0.7.0"
  psf:
    command_template: 'makepsf stars {optional_sym} {optional_ks} "-savepsf={psf_path}"'
    default_source: "STARS"
  restore:
    command_template: "rl -iters={iterations} {optional_regularization} {optional_alpha} {optional_mul}"
    method: "RICHARDSON_LUCY"
    default_iterations: 10
    default_regularization: "NONE"
    default_alpha: 3000
    multiplicative: false
  safety:
    require_linear: true
    require_preview_same_parameters_before_gui_apply: true
