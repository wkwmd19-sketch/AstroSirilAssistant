schema_version: "0.3"

command_mapping:
  ANALYZE_INPUT:
    executor: "SIRIL_CLI"
    command_family: "jsonmetadata"
    stable_supported_from: "1.4.0"

  LOAD_IMAGE:
    executor: "SIRIL_CLI"
    command_family: "load"

  SAVE_FITS_FLOAT32:
    executor: "SIRIL_CLI"
    commands:
      - "set32bits"
      - "save"

  GRADIENT_CORRECTION:
    executor: "SIRIL_CLI"
    command_family: "subsky"
    implementation_status: "PLANNED_V0.4"

  SPCC:
    executor: "SIRIL_CLI"
    command_family: "spcc"
    implementation_status: "PLANNED_V0.4"

  GHS:
    executor: "SIRIL_CLI"
    command_family: "ght"
    implementation_status: "PLANNED_V0.4"

  STARNET:
    executor: "SIRIL_PYTHON_SCRIPT"
    command_family: "pyscript"
    runtime_adapter_required: true
    implementation_status: "PLANNED"

  PIXELMATH_RECOMBINE:
    executor: "SIRIL_CLI"
    command_family: "pm"
    implementation_status: "PLANNED"
