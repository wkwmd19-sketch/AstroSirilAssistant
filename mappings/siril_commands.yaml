schema_version: "0.3"

command_mapping:
  ANALYZE_INPUT:
    executor: "SIRIL_CLI"
    command_family: "jsonmetadata"
    stable_supported_from: "1.4.0"

  LOAD_IMAGE:
    executor: "SIRIL_CLI"
    command_family: "load"

  SAVE_FITS_FLOAT32:
    executor: "SIRIL_CLI"
    commands:
      - "set32bits"
      - "save"

  GRADIENT_CORRECTION:
    executor: "SIRIL_CLI"
    command_family: "subsky"
    implementation_status: "PLANNED_V0.4"

  SPCC:
    executor: "SIRIL_CLI"
    command_family: "spcc"
    implementation_status: "PLANNED_V0.4"

  GHS:
    executor: "SIRIL_CLI"
    command_family: "ght"
    implementation_status: "PLANNED_V0.4"

  STARNET:
    executor: "SIRIL_PYTHON_SCRIPT"
    command_family: "pyscript"
    runtime_adapter_required: true
    implementation_status: "PLANNED"

  PIXELMATH_RECOMBINE:
    executor: "SIRIL_CLI"
    command_family: "pm"
    implementation_status: "PLANNED"


CALIBRATION_SCAN:
  executor: "ASTROAUTO_NATIVE"
  implementation_status: "IMPLEMENTED_V0.3.1"
  notes:
    - "Dark/Bias/Flat/Dark-flat 폴더를 스캔하고 FITS 헤더 호환성을 검사"

MASTER_CALIBRATION_FRAMES:
  executor: "SIRIL_CLI"
  implementation_status: "PLANNED_NEXT"
  notes:
    - "Master Dark/Bias/Flat/Dark-flat 생성은 센서/데이터 유형별 정책을 확정한 뒤 연결"

PREPROCESS_LIGHTS:
  executor: "SIRIL_CLI"
  implementation_status: "PLANNED_NEXT"
  guards:
    - "PRECALIBRATED 입력에는 실행 금지"
    - "호환성 검사와 사용자 승인 필요"
